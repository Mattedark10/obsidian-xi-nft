name: Generate NFT

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate NFT
        run: |
          python generate.py

      - name: Upload generated NFT
        uses: actions/upload-artifact@v4
        with:
          name: generated-nft
          path: output/
