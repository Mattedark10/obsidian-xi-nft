name: Generate NFT

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate NFT
        run: |
          python generate.py

      - name: Save generated NFTs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No new NFT files to commit."
          else
            git commit -m "Generate NFTs"
            git push
          fi

      - name: Upload generated NFT
        uses: actions/upload-artifact@v4
        with:
          name: generated-nft
          path: output/